<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>巨魔沼泽 · 第二批十二种怪物</title>
<style>
@font-face{font-family:BoardChinese;src:url('../../../../engines/default/data/font/zh_hans/WenQuanYiMicroHei.ttf');font-display:swap}
:root{color-scheme:dark;--faction:transparent;--paper:#eee6cc;--muted:#b7b69e;--line:#74765b}
*{box-sizing:border-box}body{margin:0;background:#19211d;color:var(--paper);font:16px/1.55 BoardChinese,system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}
header{border-top:3px solid #a99567;padding:16px 0}h1{font-size:29px;margin:3px 0;font-weight:600}.eyebrow{font-size:12px;letter-spacing:.16em;color:#d3bb85}p{color:var(--muted);margin:4px 0 12px}h2{margin:0;font-size:18px;font-weight:550}.id{font-size:12px;color:#aab3a2}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 18px}button,select{font:inherit;padding:5px 12px;color:var(--paper);background:#303b31;border:1px solid var(--line);cursor:pointer}button[aria-pressed=true]{background:#505441;border-color:#d7c698}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #b4d7db;outline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{border:1px solid #57604b;padding:14px;background:#273025;min-width:0}.hero{display:flex;align-items:center;justify-content:center;height:224px;background-image:url('../../data/gfx/refined/grass0.png');background-size:112px;margin:10px 0 8px}.token{--size:208px;width:var(--size);height:var(--size);display:inline-block;position:relative;flex-shrink:0;vertical-align:middle}.token img{display:block;width:100%;height:100%;object-fit:contain}.token::after{content:'';position:absolute;inset:6%;border:max(1px,calc(var(--size)*.018)) solid var(--faction);border-radius:50%;pointer-events:none}
.samples{display:flex;align-items:flex-end;justify-content:space-evenly;border-top:1px solid #4d5943;padding-top:12px;gap:5px}figure{margin:0;text-align:center}figcaption{font-size:12px;color:var(--muted);margin-top:3px}.trait{font-size:14px;min-height:48px;margin-top:13px}.original{border-top:1px solid #4d5943;padding:10px 0 0;display:flex;align-items:center;gap:15px}.original img{width:64px;height:64px;object-fit:contain}.original span{font-size:12px;color:var(--muted)}.note{margin-top:20px;border:1px solid #6a7055;padding:13px 17px;font-size:14px;color:var(--muted)}a{color:#dcc58b}footer{margin-top:14px;font-size:13px;color:var(--muted)}
.grey .token{filter:grayscale(1)}.water .hero{background-image:url('../../data/gfx/refined/water0.png')}.light .hero{background:#bdb08b}.compact .cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}.compact article{padding:10px}.compact h2{font-size:16px}.compact .hero{height:158px;background-size:79px}.compact .hero .token{--size:156px!important}.compact .samples,.compact .trait,.compact .original{display:none}.compact .id{font-size:11px}
@media(max-width:1050px){.cards,.compact .cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){main{padding:14px}.cards,.compact .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.samples{flex-wrap:wrap}.hero{height:180px}.hero .token{--size:172px!important}}
</style>
<main><header><div class="eyebrow">TROLLMIRE · CREATURE STUDY 02</div><h1>第二批 · 十二款怪物棋子</h1><p>增加同族差异、独特巨魔、鼠与蜂群、水生轮廓。连同首批，共 17 款素材候选。</p></header>
<div class="toolbar">
<label>分组 <select id="group"><option value="all">全部 12 种</option><option value="giants">巨魔与独特角色</option><option value="beasts">陆地兽类</option><option value="shapes">蛇、群体与水生怪</option></select></label>
<label>底图 <select id="ground"><option value="grass">草地</option><option value="water">水面</option><option value="light">浅色底</option></select></label>
<label>阵营圈 <select id="faction"><option value="transparent">无 · 查看母版</option><option value="#cf6356">敌对</option><option value="#78bda0">友好</option><option value="#ccba84">中立</option></select></label>
<button id="grey" aria-pressed="false">灰度检查</button><button id="compact" aria-pressed="false">总览</button>
</div><div class="cards" id="cards"></div>
<div class="note">这是<strong>素材审阅页，不是实机截图</strong>。所有生物由内置 ImageGen 生成，尺寸归一化不修改造型或配色；阵营圈由页面独立绘制。48 / 64 / 96px 为实际导出尺寸，请以浏览器 100% 缩放查看。</div>
<footer><a href="?compact=1&amp;all=1">全部 17 款总览</a> · <a href="BRIEF.md">本批规范</a> · <a href="REVIEW.md">检查与限制</a> · <a href="../monsters-v1/index.html">首批五种</a> · <a href="../monsters-v1/inventory/inventory.md">物种映射计划</a> · 原始 PNG 与完整提示词分别在 masters/、prompts/。</footer></main>
<script src="catalog.js"></script><script>
const args=new URLSearchParams(location.search);
let catalog=window.monsterCatalog||[];
const first=[
{id:'forest-troll',name:'森林巨魔',entity:'forest troll',original:'npc/troll_f.png'},
{id:'wolf',name:'狼',entity:'wolf',original:'npc/canine_w.png'},
{id:'brown-bear',name:'棕熊',entity:'brown bear',original:'npc/brown_bear.png'},
{id:'brown-snake',name:'棕蛇',entity:'large brown snake',original:'npc/umber-snake.png'},
{id:'venus-flytrap',name:'巨型捕蝇草',entity:'giant venus flytrap',original:'npc/immovable_plants_giant_venus_flytrap.png'}
];
if(args.get('all')==='1'){catalog=[...first.map(a=>({...a,group:'first',trait:'首批母版',batch:'monsters-v1'})),...catalog];document.querySelector('h1').textContent='怪物棋子 · 十七款母版总览';document.querySelector('#group option').textContent='全部 17 款';}
function token(id,size){const b=document.createElement('span');b.className='token';b.style.setProperty('--size',size+'px');const im=new Image();const prefix=catalog.find(a=>a.id===id).batch==='monsters-v1'?'../monsters-v1/':'';im.src=prefix+'sprites/'+([48,64,96].includes(size)?size:256)+'/'+id+'.png';im.alt='';b.append(im);return b}
function render(){document.getElementById('cards').replaceChildren();const group=document.getElementById('group').value;
for(const a of catalog.filter(a=>group==='all'||a.group===group)){const c=document.createElement('article');const h=document.createElement('h2');h.textContent=a.name;c.append(h);const id=document.createElement('div');id.className='id';id.textContent=a.entity;c.append(id);const hero=document.createElement('div');hero.className='hero';hero.append(token(a.id,208));c.append(hero);const samples=document.createElement('div');samples.className='samples';for(const size of [48,64,96]){const f=document.createElement('figure');f.append(token(a.id,size));const cap=document.createElement('figcaption');cap.textContent=size+' px';f.append(cap);samples.append(f)}c.append(samples);const trait=document.createElement('p');trait.className='trait';trait.textContent=a.trait;c.append(trait);const native=document.createElement('div');native.className='original';const im=new Image();im.src='../../../../modules/tome/data/gfx/shockbolt/'+a.original;im.alt='原生参考';native.append(im);const label=document.createElement('span');label.textContent='原生身份参考 · '+a.original;native.append(label);c.append(native);document.getElementById('cards').append(c)}}
document.getElementById('group').addEventListener('change',render);
document.getElementById('faction').addEventListener('change',e=>document.documentElement.style.setProperty('--faction',e.target.value));
document.getElementById('ground').addEventListener('change',e=>{document.body.classList.remove('water','light');if(e.target.value!=='grass')document.body.classList.add(e.target.value)});
for(const id of ['grey','compact'])document.getElementById(id).addEventListener('click',e=>e.currentTarget.setAttribute('aria-pressed',document.body.classList.toggle(id)));
if(args.get('group'))document.getElementById('group').value=args.get('group');for(const id of ['grey','compact'])if(args.get(id)==='1')document.getElementById(id).click();render();
</script></html>
